openapi: 3.0.0
info:
  title: CollabDesk API
  description: The production backend API for the CollabDesk SaaS product.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Successful login
  /workspaces:
    get:
      summary: Get Workspaces
      tags: [Workspaces]
      responses:
        "200":
          description: A list of workspaces for the user
  /projects:
    get:
      summary: Get Projects
      tags: [Projects]
      responses:
        "200":
          description: A list of projects for the workspace
  /tasks:
    get:
      summary: Get Tasks
      tags: [Tasks]
      responses:
        "200":
          description: A list of tasks for the workspace
  /dashboard/member:
    get:
      summary: Get Member Dashboard Metrics
      tags: [Dashboards]
      responses:
        "200":
          description: Aggregated data for member dashboard
  /files/signature:
    get:
      summary: Get Cloudinary Signature
      tags: [Files]
      responses:
        "200":
          description: Signature and timestamp for direct upload
