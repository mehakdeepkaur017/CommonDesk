version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: collabdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/collabdesk?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:3000
      - JWT_SECRET=supersecret
      - JWT_REFRESH_SECRET=supersecret_refresh
      - CLOUDINARY_CLOUD_NAME=demo
      - CLOUDINARY_API_KEY=demo
      - CLOUDINARY_API_SECRET=demo
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
